name: Build macOS Video Inpaint Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/video_inpaint_engine.py'
      - '.github/workflows/build_mac_engine.yml'

jobs:
  build-macos:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4) - Primary macOS target
          - os: macos-14
            arch: arm64
            output_name: video_inpaint_engine
          # Intel Mac (x86_64) - Legacy Mac target
          - os: macos-13
            arch: x86_64
            output_name: video_inpaint_engine_x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python onnxruntime numpy pillow pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --onefile --clean -y \
            --name "${{ matrix.output_name }}" \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module IPython \
            engine/video_inpaint_engine.py

      - name: Set Execution Permissions & Ad-hoc Codesign
        run: |
          chmod +x "dist/${{ matrix.output_name }}"
          # Ad-hoc sign so macOS Gatekeeper allows execution without notarization errors
          codesign --force --deep -s - "dist/${{ matrix.output_name }}"

      - name: Verify Binary Startup (Smoke Test)
        run: |
          ./dist/${{ matrix.output_name }} --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error
