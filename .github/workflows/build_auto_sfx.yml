name: Build Auto SFX Engine (macOS)

on:
  workflow_dispatch:
    inputs:
      build_mac_arm64:
        description: 'Build macOS Apple Silicon (arm64) binary'
        type: boolean
        default: true
      build_mac_intel:
        description: 'Build macOS Intel (x86_64) binary'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - 'engine/auto_sfx_engine.py'
      - 'auto_sfx_engine.spec'
      - '.github/workflows/build_auto_sfx.yml'

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mac_arm64 }}
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy scipy soundfile librosa onnxruntime tokenizers opencv-python-headless

      - name: Compile macOS Apple Silicon binary with PyInstaller
        run: |
          pyinstaller --clean auto_sfx_engine.spec
          chmod +x dist/auto_sfx_engine

      - name: Verify binary execution
        run: |
          ./dist/auto_sfx_engine --help

      - name: Log default deployment destination
        run: |
          echo "### 🍏 macOS Apple Silicon (arm64) Binary Built" >> $GITHUB_STEP_SUMMARY
          echo "**Default Destination**: \`com.assetstation/engine/mac/auto_sfx_engine\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload macOS ARM64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_sfx_engine-macos-arm64
          path: dist/auto_sfx_engine
          if-no-files-found: error
          retention-days: 30

  build-macos-intel:
    name: Build macOS (Intel x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mac_intel }}
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy scipy soundfile librosa onnxruntime tokenizers opencv-python-headless

      - name: Compile macOS Intel binary with PyInstaller
        env:
          SFX_EXE_NAME: auto_sfx_engine_x86_64
        run: |
          pyinstaller --clean auto_sfx_engine.spec
          if [ -f dist/auto_sfx_engine ] && [ ! -f dist/auto_sfx_engine_x86_64 ]; then
            cp dist/auto_sfx_engine dist/auto_sfx_engine_x86_64
          fi
          chmod +x dist/auto_sfx_engine_x86_64

      - name: Verify binary execution
        run: |
          ./dist/auto_sfx_engine_x86_64 --help

      - name: Log default deployment destination
        run: |
          echo "### 🍎 macOS Intel (x86_64) Binary Built" >> $GITHUB_STEP_SUMMARY
          echo "**Default Destination**: \`com.assetstation/engine/mac/auto_sfx_engine_x86_64\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload macOS Intel binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_sfx_engine-macos-x86_64
          path: dist/auto_sfx_engine_x86_64
          if-no-files-found: error
          retention-days: 30
