name: Build Auto SFX Engine (macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. INTEL MAC BUILD (x86_64 compiled via Rosetta on modern Mac runner)
  # =========================================================================
  build-intel-x86_64:
    runs-on: macos-latest # Standard runner available on all GitHub plans
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable Rosetta 2
      run: |
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Set up Python (x64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Verify Architecture
      run: |
        arch -x86_64 python -c "import platform; print('Active Python Machine:', platform.machine(), platform.architecture())"

    - name: Install dependencies (x64)
      run: |
        arch -x86_64 python -m pip install --upgrade pip
        arch -x86_64 python -m pip install --prefer-binary pyinstaller
        arch -x86_64 python -m pip install --prefer-binary numpy scipy soundfile onnxruntime tokenizers opencv-python-headless
        if [ -f "requirements.txt" ]; then arch -x86_64 python -m pip install --prefer-binary "llvmlite<=0.43.0" "numba<=0.60.0" -r requirements.txt || true; fi

    - name: Compile Intel Executable
      run: |
        # Locate auto_sfx_engine.py in root or engine/
        if [ -f "engine/auto_sfx_engine.py" ]; then
          TARGET_SCRIPT="engine/auto_sfx_engine.py"
        elif [ -f "auto_sfx_engine.py" ]; then
          TARGET_SCRIPT="auto_sfx_engine.py"
        else
          echo "ERROR: auto_sfx_engine.py not found!" && exit 1
        fi

        # If .spec exists, compile with spec; otherwise run full PyInstaller command
        if [ -f "auto_sfx_engine.spec" ]; then
          SFX_EXE_NAME=auto_sfx_engine_x86_64 TARGET_ARCH=x86_64 arch -x86_64 pyinstaller --clean auto_sfx_engine.spec
        else
          arch -x86_64 pyinstaller --target-arch x86_64 --clean --onefile --name auto_sfx_engine_x86_64 \
            --collect-all soundfile \
            --collect-all _soundfile_data \
            --collect-all tokenizers \
            --collect-all onnxruntime \
            --hidden-import scipy.fft \
            --hidden-import scipy.signal \
            --hidden-import scipy.special \
            --hidden-import cv2 \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module torch \
            --exclude-module torchvision \
            "$TARGET_SCRIPT"
        fi

        if [ -f "dist/auto_sfx_engine" ] && [ ! -f "dist/auto_sfx_engine_x86_64" ]; then
          cp dist/auto_sfx_engine dist/auto_sfx_engine_x86_64
        fi
        chmod +x dist/auto_sfx_engine_x86_64
        codesign --force -s - dist/auto_sfx_engine_x86_64 || true
        file dist/auto_sfx_engine_x86_64

    - name: Log destination
      run: |
        echo "### 🍎 macOS Intel (x86_64) Binary Built" >> $GITHUB_STEP_SUMMARY
        echo "**Deploy location in extension**: \`com.assetstation/engine/mac/auto_sfx_engine_x86_64\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Intel Mac Executable
      uses: actions/upload-artifact@v4
      with:
        name: auto_sfx_engine_x86_64
        path: dist/auto_sfx_engine_x86_64

  # =========================================================================
  # 2. APPLE SILICON BUILD (arm64)
  # =========================================================================
  build-apple-silicon-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python (arm64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'arm64'

    - name: Verify Architecture
      run: |
        python -c "import platform; print('Active Python Machine:', platform.machine(), platform.architecture())"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary pyinstaller
        pip install --prefer-binary numpy scipy soundfile onnxruntime tokenizers opencv-python-headless
        if [ -f "requirements.txt" ]; then pip install --prefer-binary "llvmlite<=0.43.0" "numba<=0.60.0" -r requirements.txt || true; fi

    - name: Compile Apple Silicon Executable
      run: |
        # Locate auto_sfx_engine.py in root or engine/
        if [ -f "engine/auto_sfx_engine.py" ]; then
          TARGET_SCRIPT="engine/auto_sfx_engine.py"
        elif [ -f "auto_sfx_engine.py" ]; then
          TARGET_SCRIPT="auto_sfx_engine.py"
        else
          echo "ERROR: auto_sfx_engine.py not found!" && exit 1
        fi

        # If .spec exists, compile with spec; otherwise run full PyInstaller command
        if [ -f "auto_sfx_engine.spec" ]; then
          SFX_EXE_NAME=auto_sfx_engine TARGET_ARCH=arm64 pyinstaller --clean auto_sfx_engine.spec
        else
          pyinstaller --target-arch arm64 --clean --onefile --name auto_sfx_engine \
            --collect-all soundfile \
            --collect-all _soundfile_data \
            --collect-all tokenizers \
            --collect-all onnxruntime \
            --hidden-import scipy.fft \
            --hidden-import scipy.signal \
            --hidden-import scipy.special \
            --hidden-import cv2 \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module torch \
            --exclude-module torchvision \
            "$TARGET_SCRIPT"
        fi

        chmod +x dist/auto_sfx_engine
        codesign --force -s - dist/auto_sfx_engine || true
        file dist/auto_sfx_engine

    - name: Log destination
      run: |
        echo "### 🍏 macOS Apple Silicon (arm64) Binary Built" >> $GITHUB_STEP_SUMMARY
        echo "**Deploy location in extension**: \`com.assetstation/engine/mac/auto_sfx_engine\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Apple Silicon Executable
      uses: actions/upload-artifact@v4
      with:
        name: auto_sfx_engine
        path: dist/auto_sfx_engine
